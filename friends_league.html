<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Friends League</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#15803d;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:18px 15px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:2px}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:14px;background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#eef0f4;color:var(--text)}button.danger{background:#fee2e2;color:#991b1b}.icon{font-size:18px;padding:9px 11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #00000008}.hero{background:#111827;color:white;border:0;padding:20px}.hero .muted{color:#cbd5e1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.game{padding:15px 8px;text-align:center;border-radius:15px;background:#f1f3f6;border:1px solid var(--line);font-size:14px}.emoji{font-size:27px;display:block;margin-bottom:6px}
h1,h2,h3,p{margin:0}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack>*+*{margin-top:9px}
nav{position:sticky;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 8px 30px #0002;margin-top:20px}nav button{background:transparent;color:var(--muted);padding:10px 5px;font-size:11px}nav button.active{background:#111827;color:#fff}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:15px;color:var(--text)}label{font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:5px}
.check{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:11px}.check input{width:auto}
.player-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f5f9}.winner{font-weight:800}.pending{color:var(--warn)}.verified{color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.hide{display:none}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;z-index:20}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f4f5f7;border-radius:13px;padding:12px;text-align:center}.stat b{font-size:21px;display:block}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">🏆 Friends League</div><div class="sub">Tu historial de competencias</div></div>
    <button class="icon secondary" onclick="openSettings()">⚙️</button>
  </div>
  <main id="main"></main>
  <nav id="nav">
    <button data-tab="home" onclick="showTab('home')">🏠<br>Inicio</button>
    <button data-tab="add" onclick="showTab('add')">➕<br>Partida</button>
    <button data-tab="stats" onclick="showTab('stats')">📊<br>Stats</button>
    <button data-tab="players" onclick="showTab('players')">👥<br>Jugadores</button>
  </nav>
</div>
<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='friends_league_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 players:[{id:'barto',name:'Barto',password:''},{id:'franco',name:'Franco',password:''},{id:'segundo',name:'Segundo',password:''}],
 games:[], next:1
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function player(id){return db.players.find(p=>p.id===id)}
function gameName(g){return g==='truco'?'Truco':g==='pong'?'Beer Pong':'Dudo'}
function icon(g){return g==='truco'?'🃏':g==='pong'?'🍺':'🎲'}
function showTab(tab){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='home')home(); if(tab==='add')addGame(); if(tab==='stats')stats(); if(tab==='players')players();
}
function home(){
 let confirmed=db.games.filter(g=>g.status==='confirmed').length, pending=db.games.filter(g=>g.status!=='confirmed').length;
 let recent=[...db.games].sort((a,b)=>b.id-a.id).slice(0,5);
 document.getElementById('main').innerHTML=`
 <div class="card hero"><div class="muted small">PARTIDAS REGISTRADAS</div><div style="font-size:38px;font-weight:800">${db.games.length}</div><div class="muted">${confirmed} confirmadas · ${pending} pendientes</div></div>
 <div class="card"><h2>Registrar</h2><div class="grid">
 <button class="game" onclick="startAdd('truco')"><span class="emoji">🃏</span>Truco</button>
 <button class="game" onclick="startAdd('pong')"><span class="emoji">🍺</span>Beer Pong</button>
 <button class="game" onclick="startAdd('dudo')"><span class="emoji">🎲</span>Dudo</button></div></div>
 <div class="card"><div class="row"><h2>Últimas partidas</h2><button class="secondary small" onclick="showTab('stats')">Ver todas</button></div>
 ${recent.length?recent.map(renderGame).join(''):'<p class="muted">Todavía no hay partidas.</p>'}</div>`;
}
function renderGame(g){
 let names=g.players.map(player).filter(Boolean).map(p=>p.name).join(' · ');
 return `<div class="card" style="margin:8px 0;padding:13px" onclick="viewGame(${g.id})"><div class="row"><div><b>${icon(g.type)} ${gameName(g.type)}</b><div class="small muted">${esc(names)} · ${g.date}</div></div><div style="text-align:right"><div class="winner">🏆 ${esc(player(g.winner)?.name||'?')}</div><div class="${g.status==='confirmed'?'verified':'pending'} small">${g.status==='confirmed'?'✓ Confirmada':'⏳ '+g.verified.length+'/'+(g.players.length-1)}</div></div></div></div>`;
}
function startAdd(type){showTab('add');setTimeout(()=>{let s=document.getElementById('type');if(s){s.value=type;buildAdd()}})}
function addGame(){
 document.getElementById('main').innerHTML=`<div class="card"><h2>Nueva partida</h2><div class="stack">
 <div><label>Juego</label><select id="type" onchange="buildAdd()"><option value="truco">🃏 Truco</option><option value="pong">🍺 Beer Pong</option><option value="dudo">🎲 Dudo</option></select></div>
 <div id="addFields"></div></div></div>`;
 buildAdd();
}
function buildAdd(){
 let type=document.getElementById('type').value, f=document.getElementById('addFields');
 let checks=db.players.map(p=>`<label class="check"><input type="checkbox" name="gp" value="${p.id}" ${type==='dudo'?'':' '}> ${esc(p.name)}</label>`).join('');
 f.innerHTML=`<div><label>Quiénes jugaron</label><div class="stack">${checks}</div></div>
 <div><label>Ganador</label><select id="winner"><option value="">Seleccioná</option></select></div>
 <div id="scoreFields">${type==='dudo'?'<div><label>Resultado / nota (opcional)</label><input id="score" placeholder="Ej.: última ronda, 5 dados..."></div>':'<div><label>Resultado</label><input id="score" placeholder="Ej.: 15-10"></div>'}</div>
 <button onclick="recordGame()">Registrar partida</button>`;
 document.querySelectorAll('input[name=gp]').forEach(x=>x.onchange=refreshWinners);
 refreshWinners();
}
function refreshWinners(){
 let selected=[...document.querySelectorAll('input[name=gp]:checked')].map(x=>x.value);
 let w=document.getElementById('winner'); if(!w)return;
 w.innerHTML='<option value="">Seleccioná</option>'+selected.map(id=>`<option value="${id}">${esc(player(id).name)}</option>`).join('');
}
function recordGame(){
 let type=document.getElementById('type').value;
 let ids=[...document.querySelectorAll('input[name=gp]:checked')].map(x=>x.value), winner=document.getElementById('winner').value;
 let score=document.getElementById('score')?.value.trim()||'';
 if(type==='dudo' && ids.length<2)return alert('Dudo necesita al menos 2 jugadores.');
 if(type!=='dudo' && ids.length!==2)return alert('Seleccioná exactamente 2 jugadores.');
 if(!winner)return alert('Seleccioná un ganador.');
 let g={id:db.next++,type,players:ids,winner,score,date:new Date().toLocaleDateString('es-AR'),verified:[],status:'pending'};
 db.games.push(g);save();viewGame(g.id);toast('Partida registrada');
}
function viewGame(id){
 let g=db.games.find(x=>x.id===id), names=g.players.map(x=>player(x)?.name).filter(Boolean);
 let ver=g.verified.map(x=>player(x)?.name).filter(Boolean);
 document.getElementById('sheet').innerHTML=`<div class="row"><h2>${icon(g.type)} ${gameName(g.type)}</h2><button class="secondary icon" onclick="closeModal()">✕</button></div>
 <p class="muted small">${g.date}</p><div class="card"><div class="small muted">JUGADORES</div><h3>${names.join(' · ')}</h3><div style="margin-top:10px">🏆 <b>${esc(player(g.winner)?.name||'?')}</b></div>${g.score?`<div class="muted" style="margin-top:6px">Resultado: ${esc(g.score)}</div>`:''}</div>
 <div class="card"><h3>Verificación</h3><p class="small muted" style="margin:6px 0 12px">Cada jugador que no ganó debe confirmar la victoria.</p>${g.players.filter(x=>x!==g.winner).map(id=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(player(id).name)}</span><span class="${g.verified.includes(id)?'verified':'pending'}">${g.verified.includes(id)?'✓ Verificó':'⏳ Pendiente'}</span></div>`).join('')}
 ${g.status!=='confirmed'?`<button style="margin-top:12px;width:100%" onclick="verifyGame(${g.id})">🔐 Verificar resultado</button>`:`<div class="verified" style="margin-top:12px;text-align:center;font-weight:700">✓ Resultado confirmado por todos</div>`}</div>
 <button class="danger" style="width:100%" onclick="deleteGame(${g.id})">Eliminar partida</button>`;
 openModal();
}
function verifyGame(id){
 let g=db.games.find(x=>x.id===id), available=g.players.filter(x=>x!==g.winner && !g.verified.includes(x));
 document.getElementById('sheet').innerHTML=`<div class="row"><h2>🔐 Verificar</h2><button class="secondary icon" onclick="viewGame(${id})">✕</button></div><p class="muted small">Seleccioná tu nombre e ingresá tu contraseña.</p><div class="stack" style="margin-top:14px"><div><label>Jugador</label><select id="vid">${available.map(x=>`<option value="${x}">${esc(player(x).name)}</option>`).join('')}</select></div><div><label>Contraseña</label><input id="vpw" type="password" placeholder="Contraseña"></div><button onclick="doVerify(${id})">Confirmar victoria</button></div>`;
}
function doVerify(id){
 let g=db.games.find(x=>x.id===id), pid=document.getElementById('vid').value, pw=document.getElementById('vpw').value, p=player(pid);
 if(!p)return;if(p.password && p.password!==pw)return alert('Contraseña incorrecta.');
 if(!p.password){return alert('Este jugador todavía no tiene contraseña. Configurala desde Jugadores.')}
 if(!g.verified.includes(pid))g.verified.push(pid);
 if(g.verified.length===g.players.length-1)g.status='confirmed';
 save();viewGame(id);toast(g.status==='confirmed'?'¡Partida confirmada!':'Verificación registrada');
}
function stats(){
 let rows=db.players.map(p=>{let played=db.games.filter(g=>g.status==='confirmed'&&g.players.includes(p.id)).length,wins=db.games.filter(g=>g.status==='confirmed'&&g.winner===p.id).length;return {p,played,wins,loss:played-wins,rate:played?Math.round(wins/played*100):0}}).sort((a,b)=>b.wins-a.wins);
 document.getElementById('main').innerHTML=`<div class="card"><h2>📊 Ranking</h2><table><tr><th>Jugador</th><th>V</th><th>D</th><th>%</th></tr>${rows.map(r=>`<tr><td><b>${esc(r.p.name)}</b></td><td>${r.wins}</td><td>${r.loss}</td><td>${r.rate}%</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Enfrentamientos</h2><p class="small muted">Solo partidas confirmadas.</p>${db.players.map((a,i)=>db.players.slice(i+1).map(b=>{let gs=db.games.filter(g=>g.status==='confirmed'&&g.players.includes(a.id)&&g.players.includes(b.id));let aw=gs.filter(g=>g.winner===a.id).length,bw=gs.filter(g=>g.winner===b.id).length;return `<div class="row" style="padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(a.name)} vs ${esc(b.name)}</span><b>${aw} - ${bw}</b></div>`}).join('')).join('')}</div>
 <div class="card"><h2>Historial</h2>${[...db.games].reverse().map(renderGame).join('')||'<p class="muted">Sin partidas.</p>'}</div>`;
}
function players(){
 document.getElementById('main').innerHTML=`<div class="card"><div class="row"><h2>👥 Jugadores</h2><button onclick="newPlayer()">+ Agregar</button></div>${db.players.map(p=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.name)}</b><div class="small muted">${p.password?'Contraseña configurada':'Sin contraseña'}</div></div><button class="secondary" onclick="editPlayer('${p.id}')">Editar</button></div>`).join('')}</div>
 <div class="card"><p class="small muted">Las contraseñas se guardan solamente en este dispositivo. No se envían a ningún servidor.</p></div>`;
}
function newPlayer(){document.getElementById('sheet').innerHTML=`<h2>Nuevo jugador</h2><div class="stack"><div><label>Nombre</label><input id="pn"></div><div><label>Contraseña</label><input id="pp" type="password"></div><button onclick="createPlayer()">Crear jugador</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;openModal()}
function createPlayer(){let n=document.getElementById('pn').value.trim(),pw=document.getElementById('pp').value;if(!n||!pw)return alert('Completá nombre y contraseña.');db.players.push({id:'p'+Date.now(),name:n,password:pw});save();closeModal();players()}
function editPlayer(id){let p=player(id);document.getElementById('sheet').innerHTML=`<h2>Editar ${esc(p.name)}</h2><div class="stack"><div><label>Nombre</label><input id="pn" value="${esc(p.name)}"></div><div><label>Contraseña</label><input id="pp" type="password" value="${esc(p.password)}"></div><button onclick="savePlayer('${id}')">Guardar</button><button class="danger" onclick="removePlayer('${id}')">Eliminar jugador</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;openModal()}
function savePlayer(id){let p=player(id);p.name=document.getElementById('pn').value.trim()||p.name;p.password=document.getElementById('pp').value;save();closeModal();players()}
function removePlayer(id){if(db.games.some(g=>g.players.includes(id)))return alert('No se puede eliminar un jugador que tiene partidas registradas.');if(confirm('¿Eliminar jugador?')){db.players=db.players.filter(p=>p.id!==id);save();closeModal();players()}}
function deleteGame(id){if(confirm('¿Eliminar esta partida?')){db.games=db.games.filter(g=>g.id!==id);save();closeModal();showTab('stats')}}
function openSettings(){document.getElementById('sheet').innerHTML=`<h2>⚙️ Datos</h2><div class="stack"><p class="small muted">Todo se guarda en este navegador mediante almacenamiento local.</p><button onclick="exportData()">Exportar respaldo</button><button class="secondary" onclick="importData()">Importar respaldo</button><button class="danger" onclick="resetData()">Borrar todos los datos</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`;openModal()}
function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db));a.download='friends-league-backup.json';a.click()}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();closeModal();showTab('home');toast('Respaldo importado')}catch{alert('Archivo inválido')}};r.readAsText(e.target.files[0])};i.click()}
function resetData(){if(confirm('Esto borrará todas las partidas y jugadores. ¿Continuar?')){localStorage.removeItem(KEY);location.reload()}}
function openModal(){document.getElementById('modal').classList.remove('hide')}
function closeModal(){document.getElementById('modal').classList.add('hide')}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
showTab('home');
</script>
</body>
</html>
