<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Amigos</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a1a1a; font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-top: 0; }
        
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-nav { flex: 1; padding: 12px; background: #e9ecef; border: none; border-radius: 8px; font-weight: bold; color: #495057; cursor: pointer; }
        .btn-nav.active { background: #000; color: #fff; }
        
        .card { border: 1px solid #eaeaea; padding: 15px; margin-bottom: 15px; border-radius: 10px; background: #fafafa; }
        .pendiente { border-left: 6px solid #f59e0b; }
        .oficial { border-left: 6px solid #10b981; }
        .badge { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 12px; }
        .badge.pend { background: #fef3c7; color: #92400e; }
        .badge.ofic { background: #d1fae5; color: #065f46; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 16px;}
        .checkbox-item input { width: 20px; height: 20px; }

        .btn-primary { background-color: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .btn-primary:hover { background-color: #0056b3; }
        
        .firma-box { background: #fff3cd; padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid #ffe69c; }
        .firma-row { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
        .btn-firmar { background: #198754; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;}
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Liga de Amigos</h1>
    
    <div class="nav-buttons">
        <button class="btn-nav active" id="btn-feed" onclick="mostrarSeccion('feed')">Historial</button>
        <button class="btn-nav" id="btn-nueva" onclick="mostrarSeccion('nueva-partida')">+ Cargar</button>
    </div>

    <div id="feed" class="seccion">
        <div id="lista-partidas">Cargando...</div>
    </div>

    <div id="nueva-partida" class="seccion hidden">
        <h2>Registrar Partido</h2>
        
        <div class="input-group">
            <label>Juego</label>
            <select id="juego-select">
                <option value="Dudo">Dudo (Dados)</option>
                <option value="Truco">Truco</option>
                <option value="Beer Pong">Beer Pong</option>
            </select>
        </div>

        <div class="input-group">
            <label>¿Quién carga esto? (Tu usuario)</label>
            <select id="creador-select"></select>
        </div>

        <div class="input-group">
            <label>👑 Ganador (Elegí 1)</label>
            <select id="ganador-select"></select>
        </div>
        
        <div class="input-group">
            <label>❌ Perdedores (Seleccioná varios)</label>
            <div class="checkbox-group" id="perdedores-container">
            </div>
        </div>

        <button class="btn-primary" onclick="guardarPartida()">Guardar Resultado</button>
    </div>
</div>

<script>
    const JUGADORES_DEFAULT = [
        { id: '1', nombre: 'Barto', pin: '1234' },
        { id: '2', nombre: 'Franco', pin: '1234' },
        { id: '3', nombre: 'Segundo', pin: '1234' }
    ];

    if (!localStorage.getItem('jugadores')) {
        localStorage.setItem('jugadores', JSON.stringify(JUGADORES_DEFAULT));
    }
    if (!localStorage.getItem('partidas')) {
        localStorage.setItem('partidas', JSON.stringify([]));
    }

    const jugadores = JSON.parse(localStorage.getItem('jugadores'));

    function mostrarSeccion(id) {
        document.querySelectorAll('.seccion').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        
        document.getElementById('btn-feed').classList.remove('active');
        document.getElementById('btn-nueva').classList.remove('active');
        
        if(id === 'feed') {
            document.getElementById('btn-feed').classList.add('active');
            cargarPartidas();
        } else {
            document.getElementById('btn-nueva').classList.add('active');
        }
    }

    function iniciarFormulario() {
        const creadorSelect = document.getElementById('creador-select');
        const ganadorSelect = document.getElementById('ganador-select');
        const perdedoresContainer = document.getElementById('perdedores-container');

        let options = '';
        let checkboxes = '';

        jugadores.forEach(j => {
            options += `<option value="${j.id}">${j.nombre}</option>`;
            checkboxes += `<label class="checkbox-item"><input type="checkbox" value="${j.id}" class="chk-perdedor"> ${j.nombre}</label>`;
        });

        creadorSelect.innerHTML = options;
        ganadorSelect.innerHTML = options;
        perdedoresContainer.innerHTML = checkboxes;
    }

    function guardarPartida() {
        const juego = document.getElementById('juego-select').value;
        const creadorId = document.getElementById('creador-select').value;
        const ganadorId = document.getElementById('ganador-select').value;
        
        const perdedoresInputs = document.querySelectorAll('.chk-perdedor:checked');
        const perdedoresIds = Array.from(perdedoresInputs).map(chk => chk.value);

        if (perdedoresIds.length === 0) {
            alert("Tenés que seleccionar al menos un perdedor.");
            return;
        }
        if (perdedoresIds.includes(ganadorId)) {
            alert("El ganador no puede estar marcado también como perdedor.");
            return;
        }

        const nuevaPartida = {
            id: 'partida_' + Date.now(),
            juego: juego,
            creador_id: creadorId,
            fecha: new Date().toISOString(),
            estado: 'pendiente',
            resultados: []
        };

        nuevaPartida.resultados.push({
            jugador_id: ganadorId,
            es_ganador: true,
            firma_verificada: (ganadorId === creadorId)
        });

        perdedoresIds.forEach(pId => {
            nuevaPartida.resultados.push({
                jugador_id: pId,
                es_ganador: false,
                firma_verificada: (pId === creadorId)
            });
        });

        const partidas = JSON.parse(localStorage.getItem('partidas'));
        partidas.push(nuevaPartida);
        localStorage.setItem('partidas', JSON.stringify(partidas));

        document.querySelectorAll('.chk-perdedor').forEach(chk => chk.checked = false);

        alert("¡Partida registrada! Pasale el celu a los demás para que firmen.");
        mostrarSeccion('feed');
    }

    function cargarPartidas() {
        const partidas = JSON.parse(localStorage.getItem('partidas'));
        const divLista = document.getElementById('lista-partidas');
        
        if (partidas.length === 0) {
            divLista.innerHTML = "<p style='text-align:center; color:gray;'>No hay partidas todavía. ¡Vayan a jugar!</p>";
            return;
        }

        partidas.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        let html = "";
        partidas.forEach(p => {
            const fechaStr = new Date(p.fecha).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
            const claseEstado = p.estado === 'oficial' ? 'oficial' : 'pendiente';
            const badgeClase = p.estado === 'oficial' ? 'ofic' : 'pend';
            
            const ganadoresNombres = p.resultados.filter(r => r.es_ganador).map(r => obtenerNombre(r.jugador_id)).join(', ');
            const perdedoresNombres = p.resultados.filter(r => !r.es_ganador).map(r => obtenerNombre(r.jugador_id)).join(', ');
            const firmasFaltantes = p.resultados.filter(r => !r.firma_verificada);

            html += `
                <div class="card ${claseEstado}">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <strong style="font-size: 18px;">${p.juego}</strong>
                        <div>
                            <span style="font-size: 12px; color: gray; margin-right: 5px;">${fechaStr}</span>
                            <span class="badge ${badgeClase}">${p.estado.toUpperCase()}</span>
                        </div>
                    </div>
                    <p style="margin: 5px 0;">👑 <strong>Ganó:</strong> ${ganadoresNombres}</p>
                    <p style="margin: 5px 0; color: #555;">❌ <strong>Perdió:</strong> ${perdedoresNombres}</p>
            `;

            if (p.estado === 'pendiente' && firmasFaltantes.length > 0) {
                html += `<div class="firma-box"><strong style="font-size: 14px; color: #856404;">Falta verificar:</strong>`;
                firmasFaltantes.forEach(faltante => {
                    const nombreFaltante = obtenerNombre(faltante.jugador_id);
                    html += `
                        <div class="firma-row">
                            <span style="flex: 1; font-weight: bold;">${nombreFaltante}</span>
                            <input type="password" id="pin-${p.id}-${faltante.jugador_id}" placeholder="PIN" style="width: 80px; padding: 6px;">
                            <button class="btn-firmar" onclick="firmar('${p.id}', '${faltante.jugador_id}')">Firmar</button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            html += `</div>`;
        });
        divLista.innerHTML = html;
    }

    function obtenerNombre(id) {
        const j = jugadores.find(j => j.id === id);
        return j ? j.nombre : 'Desconocido';
    }

    function firmar(partidaId, jugadorId) {
        const pinIngresado = document.getElementById(`pin-${partidaId}-${jugadorId}`).value;
        const jugador = jugadores.find(j => j.id === jugadorId);
        
        if (jugador.pin !== pinIngresado) {
            alert("PIN incorrecto. Intentá de nuevo.");
            return;
        }

        let partidas = JSON.parse(localStorage.getItem('partidas'));
        let partida = partidas.find(p => p.id === partidaId);
        let resultado = partida.resultados.find(r => r.jugador_id === jugadorId);
        resultado.firma_verificada = true;

        const todasFirmadas = partida.resultados.every(r => r.firma_verificada === true);
        if (todasFirmadas) {
            partida.estado = 'oficial';
            alert("¡Firma correcta! La partida ya es OFICIAL.");
        } else {
            alert("Firma correcta. Faltan los demás.");
        }

        localStorage.setItem('partidas', JSON.stringify(partidas));
        cargarPartidas();
    }

    iniciarFormulario();
    cargarPartidas();
</script>
</body>
</html>
